services:
  mysql:
    image: mysql:8.0
    container_name: billbook-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-billbook_db}
      MYSQL_USER: ${MYSQL_USER:-billbook_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme_local_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root_local_only}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: billbook-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-billbook_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-billbook_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-changeme_local_only}
      BILLBOOK_SELLER_STATE: ${BILLBOOK_SELLER_STATE:-Karnataka}
      BILLBOOK_SELLER_GSTIN: ${BILLBOOK_SELLER_GSTIN:-29AABCA4821K1Z5}
      BILLBOOK_CORS_ORIGINS: ${BILLBOOK_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: billbook-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
