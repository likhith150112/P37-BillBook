spring.application.name=billbook-backend
server.port=${SERVER_PORT:8080}

# MySQL 8 Configuration (configure via environment variables; never commit real secrets)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/billbook_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:billbook_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme_local_only}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Seller & CORS configuration
billbook.seller.state=${BILLBOOK_SELLER_STATE:Karnataka}
billbook.seller.gstin=${BILLBOOK_SELLER_GSTIN:29AABCA4821K1Z5}
billbook.cors.allowed-origins=${BILLBOOK_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Monitoring & Actuator endpoints (Module 4.8)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
info.app.name=BillBook GST Billing Backend
info.app.project=P37
